<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการพัสดุหอพัก</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Sarabun', 'Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            flash: '#FFC107',
                            jt: '#E53935',
                            shopee: '#FF5722',
                            post: '#D32F2F'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .tab-active {
            border-bottom: 3px solid #3b82f6;
            color: #3b82f6;
            font-weight: 600;
        }

        .modal-enter {
            opacity: 0;
            transform: scale(0.95);
        }
        .modal-enter-active {
            opacity: 1;
            transform: scale(1);
            transition: opacity 200ms ease-out, transform 200ms ease-out;
        }

        @keyframes slideIn {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
        .toast-show {
            animation: slideIn 0.3s forwards;
        }
        .toast-hide {
            animation: fadeOut 0.3s forwards;
        }
    </style>
</head>
<body class="text-gray-800 antialiased h-screen flex flex-col overflow-hidden">

    <header class="bg-white shadow-sm z-10 relative">
        <div class="px-4 py-3 flex justify-between items-center bg-blue-600 text-white">
            <div class="flex items-center gap-1">
                <button onclick="toggleMobileMenu()" id="hamburger-btn" class="hidden max-[850px]:flex items-center justify-center p-2 -ml-2 rounded-full hover:bg-blue-700 transition-colors focus:outline-none focus:ring-2 focus:ring-white/50" title="เมนู">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </button>
                <h1 class="text-lg font-bold">📦 ระบบจัดการพัสดุหอพัก</h1>
            </div>
            <button onclick="refreshData()" id="refresh-btn" class="p-2 rounded-full hover:bg-blue-700 transition-colors focus:outline-none focus:ring-2 focus:ring-white/50" title="รีเฟรชข้อมูล">
                <svg xmlns="http://www.w3.org/2000/svg" id="refresh-icon" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
            </button>
        </div>
        <div class="max-[850px]:hidden flex overflow-x-auto hide-scroll px-2" id="tabs-container">
            <button onclick="switchTab('all')" id="tab-all" class="flex-shrink-0 px-4 py-3 text-sm text-gray-500 hover:text-blue-600 focus:outline-none whitespace-nowrap">
                📋 ทั้งหมด
            </button>
            <button onclick="switchTab('flash')" id="tab-flash" class="flex-shrink-0 px-4 py-3 text-sm text-gray-500 hover:text-blue-600 focus:outline-none whitespace-nowrap tab-active">
                ⚡ Flash Express
            </button>
            <button onclick="switchTab('jt')" id="tab-jt" class="flex-shrink-0 px-4 py-3 text-sm text-gray-500 hover:text-blue-600 focus:outline-none whitespace-nowrap">
                🔴 J&T Express
            </button>
            <button onclick="switchTab('shopee')" id="tab-shopee" class="flex-shrink-0 px-4 py-3 text-sm text-gray-500 hover:text-blue-600 focus:outline-none whitespace-nowrap">
                🟠 Shopee Express
            </button>
            <button onclick="switchTab('post')" id="tab-post" class="flex-shrink-0 px-4 py-3 text-sm text-gray-500 hover:text-blue-600 focus:outline-none whitespace-nowrap">
                📮 ไปรษณีย์ไทย
            </button>
            <button onclick="switchTab('pending')" id="tab-pending" class="flex-shrink-0 px-4 py-3 text-sm text-gray-500 hover:text-blue-600 focus:outline-none whitespace-nowrap">
                📦 รอส่งของ
            </button>
            <button onclick="switchTab('history')" id="tab-history" class="flex-shrink-0 px-4 py-3 text-sm text-gray-500 hover:text-blue-600 focus:outline-none whitespace-nowrap">
                🕒 ประวัติ
            </button>
            <button onclick="switchTab('summary')" id="tab-summary" class="flex-shrink-0 px-4 py-3 text-sm text-gray-500 hover:text-blue-600 focus:outline-none whitespace-nowrap">
                💰 สรุปยอด
            </button>
        </div>
        <div id="mobile-menu" class="hidden absolute top-full left-0 right-0 bg-white border-t border-gray-100 shadow-lg z-30 flex-col"></div>
    </header>

    <div id="pull-refresh-indicator" class="hidden fixed left-1/2 -translate-x-1/2 z-40 bg-white rounded-full shadow-md p-2" style="top: 8px; opacity: 0; transition: opacity 0.15s;">
        <svg id="pull-refresh-icon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
    </div>

    <main class="flex-1 overflow-y-auto p-4 relative" id="main-content">
    </main>

    <button onclick="openFormModal()" class="fixed bottom-6 right-6 bg-blue-600 text-white p-4 rounded-full shadow-lg hover:bg-blue-700 hover:shadow-xl transition-all duration-200 z-20 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 flex items-center justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
        </svg>
    </button>

    <div id="detail-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black bg-opacity-50 backdrop-blur-sm p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[90vh] flex flex-col overflow-hidden transform scale-95 opacity-0 transition-all duration-200" id="detail-modal-content">
            <div class="px-6 py-4 border-b flex justify-between items-center bg-gray-50">
                <h3 class="text-lg font-bold text-gray-800">รายละเอียดพัสดุ</h3>
                <button onclick="closeDetailModal()" class="text-gray-400 hover:text-gray-600 p-1 rounded-full hover:bg-gray-200 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <div class="p-6 overflow-y-auto flex-1" id="detail-modal-body">
            </div>

            <div class="px-6 py-4 border-t bg-gray-50 flex flex-wrap gap-2 justify-end" id="detail-modal-actions">
            </div>

    </div>

    <div id="form-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black bg-opacity-50 backdrop-blur-sm p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[95vh] flex flex-col overflow-hidden transform scale-95 opacity-0 transition-all duration-200" id="form-modal-content">
            <div class="px-6 py-4 border-b flex justify-between items-center bg-blue-50">
                <h3 class="text-lg font-bold text-blue-800" id="form-modal-title">เพิ่มข้อมูลพัสดุ</h3>
                <button onclick="closeFormModal()" class="text-gray-500 hover:text-gray-800 p-1 rounded-full hover:bg-blue-100 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <div class="p-6 overflow-y-auto flex-1" id="form-scroll-area">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อ-นามสกุล</label>
                        <input type="text" id="input-name" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" placeholder="กรอกชื่อ นามสกุล">
                    </div>

                    <!-- LINE link (NEW) -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">ลิงก์ไลน์ <span class="text-gray-400 font-normal">(ถ้ามี)</span></label>
                        <input type="url" id="input-line" inputmode="url" autocapitalize="off" autocorrect="off" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition-all" placeholder="เช่น https://line.me/ti/p/xxxxxxx">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">เลขหอพัก</label>
                        <select id="input-room" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all bg-white">
                        </select>
                    </div>

                    <hr class="border-gray-200 my-4">

                    <div>
                        <div class="flex justify-between items-center mb-3">
                            <label class="block text-sm font-medium text-gray-700">รายการพัสดุ</label>
                            <button type="button" onclick="addFormItem()" class="text-sm bg-blue-100 text-blue-700 px-3 py-1 rounded-full font-medium hover:bg-blue-200 transition-colors flex items-center gap-1">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                                </svg>
                                เพิ่มของ
                            </button>
                        </div>

                        <div id="form-items-container" class="space-y-3">
                        </div>
                    </div>
                </div>
            </div>

            <div class="px-6 py-4 border-t bg-gray-50 flex gap-3 justify-end">
                <button type="button" onclick="closeFormModal()" class="px-4 py-2 text-gray-600 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 font-medium transition-colors">ยกเลิก</button>
                <button type="button" onclick="saveRecord()" class="px-4 py-2 text-white bg-blue-600 rounded-lg hover:bg-blue-700 font-medium shadow-sm transition-colors flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
                    </svg>
                    บันทึกข้อมูล
                </button>
            </div>
        </div>

    <div id="confirm-modal" class="fixed inset-0 z-[70] hidden flex items-center justify-center bg-black bg-opacity-50 backdrop-blur-sm p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm flex flex-col overflow-hidden transform scale-95 opacity-0 transition-all duration-200" id="confirm-modal-content">
            <div class="p-6 text-center">
                <div class="w-16 h-16 bg-blue-50 text-blue-500 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                </div>
                <h3 class="text-xl font-bold text-gray-800 mb-2" id="confirm-title">ยืนยันการทำรายการ?</h3>
                <p class="text-gray-500 text-sm mb-4" id="confirm-message">คุณต้องการดำเนินการนี้ใช่หรือไม่?</p>
            </div>
            <div class="bg-gray-50 px-6 py-4 flex gap-3 justify-center border-t border-gray-100">
                <button type="button" onclick="closeConfirmModal()" class="px-5 py-2 text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 font-medium transition-colors w-1/2">ยกเลิก</button>
                <button type="button" id="btn-confirm-action" class="px-5 py-2 text-white bg-blue-600 rounded-lg hover:bg-blue-700 font-medium shadow-sm transition-colors w-1/2">ยืนยัน</button>
            </div>
        </div>
    </div>

    <div id="toast-container" class="fixed top-4 left-1/2 transform -translate-x-1/2 z-[60] flex flex-col gap-2 pointer-events-none"></div>

    <script src="config.js"></script>
    <script>
        const DORM_ROOMS = ['1', '2', '3', '4', '5', '7', '13', '14', '15', '16', '17', '18', 'เรสA', 'เรสB', 'เรสC', 'เรสC2'];
        const TRANSPORTS = [
            { id: 'flash', name: 'Flash Express', colorClass: 'text-yellow-600', bgClass: 'bg-yellow-50', badgeClass: 'bg-yellow-100 text-yellow-800', icon: '⚡' },
            { id: 'jt', name: 'J&T Express', colorClass: 'text-red-600', bgClass: 'bg-red-50', badgeClass: 'bg-red-100 text-red-800', icon: '🔴' },
            { id: 'shopee', name: 'Shopee Express', colorClass: 'text-orange-600', bgClass: 'bg-orange-50', badgeClass: 'bg-orange-100 text-orange-800', icon: '🟠' },
            { id: 'post', name: 'ไปรษณีย์ไทย', colorClass: 'text-red-700', bgClass: 'bg-red-50', badgeClass: 'bg-red-100 text-red-800', icon: '📮' }
        ];

        const TABS = [
            { id: 'all', label: 'ทั้งหมด', icon: '📋' },
            { id: 'flash', label: 'Flash Express', icon: '⚡' },
            { id: 'jt', label: 'J&T Express', icon: '🔴' },
            { id: 'shopee', label: 'Shopee Express', icon: '🟠' },
            { id: 'post', label: 'ไปรษณีย์ไทย', icon: '📮' },
            { id: 'pending', label: 'รอส่งของ', icon: '📦' },
            { id: 'history', label: 'ประวัติ', icon: '🕒' },
            { id: 'summary', label: 'สรุปยอด', icon: '💰' }
        ];

        const THAI_DAY_NAMES = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
        const THAI_MONTH_NAMES = [
            'มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน',
            'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'
        ];

        function getItemFee(transportId) {
            return transportId === 'post' ? 15 : 8;
        }

        const API_BASE_URL = window.API_BASE_URL || 'http://localhost:7860';

        let records = [];
        let currentTab = 'flash';
        let currentEditingId = null;
        let mobileMenuOpen = false;
        let formData = {
            name: '',
            lineLink: '',
            room: DORM_ROOMS[0],
            items: []
        };

        // ---------- Helpers (NEW) ----------

        function escapeHtml(str) {
            return String(str ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // Normalizes a LINE link: adds https:// if missing and only allows http/https
        // (blocks things like javascript: links). Returns '' if invalid.
        function normalizeLink(raw) {
            const value = String(raw || '').trim();
            if (!value) return '';
            const withScheme = /^https?:\/\//i.test(value) ? value : `https://${value}`;
            try {
                const url = new URL(withScheme);
                return (url.protocol === 'http:' || url.protocol === 'https:') ? url.href : '';
            } catch {
                return '';
            }
        }

        // ---------- Server sync ----------

        async function loadData() {
            try {
                const res = await fetch(`${API_BASE_URL}/api/records`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                records = await res.json();
            } catch (e) {
                console.error("Error loading data from server", e);
                showToast("โหลดข้อมูลจากเซิร์ฟเวอร์ไม่สำเร็จ", "error");
            }
        }

        async function refreshData() {
            const icon = document.getElementById('refresh-icon');
            const btn = document.getElementById('refresh-btn');
            icon.classList.add('animate-spin');
            btn.disabled = true;

            await loadData();
            renderApp();

            icon.classList.remove('animate-spin');
            btn.disabled = false;
        }

        async function apiRequest(method, path, body) {
            const res = await fetch(`${API_BASE_URL}${path}`, {
                method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return res.json();
        }

        // FIX: instead of sending the WHOLE records array (which overwrote
        // other devices' changes with this device's stale copy), each change
        // now sends only the ONE record that changed.
        //
        // UI still updates instantly (optimistic); the server reply replaces
        // the local copy. On failure we reload from the server so the screen
        // never shows data that wasn't saved.
        function syncRecord(requestPromise) {
            renderApp();
            return requestPromise
                .then((saved) => {
                    const i = records.findIndex(r => r.id === saved.id);
                    if (i !== -1) records[i] = saved;
                    else records.push(saved);
                })
                .catch(async (e) => {
                    console.error("Error saving data to server", e);
                    showToast("บันทึกข้อมูลไปเซิร์ฟเวอร์ไม่สำเร็จ", "error");
                    await loadData();
                    renderApp();
                });
        }

        function createRecordOnServer(record) {
            return syncRecord(apiRequest('POST', '/api/records', record));
        }

        function updateRecordOnServer(id, fields) {
            return syncRecord(apiRequest('PATCH', `/api/records/${id}`, fields));
        }

        // ---------- App ----------

        async function initApp() {
            await loadData();

            const roomSelect = document.getElementById('input-room');
            roomSelect.innerHTML = DORM_ROOMS.map(room => `<option value="${room}">${room}</option>`).join('');

            renderMobileMenu();
            renderApp();
        }

        function renderMobileMenu() {
            const menu = document.getElementById('mobile-menu');
            menu.innerHTML = TABS.map(tab => `
                <button onclick="switchTab('${tab.id}')" id="mobile-tab-${tab.id}" class="w-full text-left px-4 py-3 text-sm text-gray-600 hover:bg-gray-50 border-b border-gray-100 last:border-b-0 focus:outline-none">
                    ${tab.icon} ${tab.label}
                </button>
            `).join('');
        }

        function toggleMobileMenu() {
            mobileMenuOpen = !mobileMenuOpen;
            const menu = document.getElementById('mobile-menu');
            menu.classList.toggle('hidden', !mobileMenuOpen);
            menu.classList.toggle('flex', mobileMenuOpen);
        }

        function closeMobileMenu() {
            mobileMenuOpen = false;
            const menu = document.getElementById('mobile-menu');
            menu.classList.add('hidden');
            menu.classList.remove('flex');
        }

        function switchTab(tabId) {
            currentTab = tabId;

            document.querySelectorAll('#tabs-container button').forEach(btn => {
                btn.classList.remove('tab-active');
                btn.classList.add('text-gray-500');
            });
            const activeTab = document.getElementById(`tab-${tabId}`);
            if (activeTab) {
                activeTab.classList.add('tab-active');
                activeTab.classList.remove('text-gray-500');
            }

            document.querySelectorAll('#mobile-menu button').forEach(btn => {
                btn.classList.remove('bg-blue-50', 'text-blue-700', 'font-semibold');
                btn.classList.add('text-gray-600');
            });
            const activeMobileTab = document.getElementById(`mobile-tab-${tabId}`);
            if (activeMobileTab) {
                activeMobileTab.classList.add('bg-blue-50', 'text-blue-700', 'font-semibold');
                activeMobileTab.classList.remove('text-gray-600');
            }

            closeMobileMenu();
            renderApp();
        }

        function renderApp() {
            const mainContent = document.getElementById('main-content');

            if (currentTab === 'all') {
                renderAllTab(mainContent);
            } else if (currentTab === 'history') {
                renderHistory(mainContent);
            } else if (currentTab === 'pending') {
                renderPending(mainContent);
            } else if (currentTab === 'summary') {
                renderSummaryTab(mainContent);
            } else {
                renderTransportTab(mainContent, currentTab);
            }
        }

        function renderSummaryTab(container) {
            const completedRecords = records.filter(r => r.status === 'completed');

            const dayMap = {};
            completedRecords.forEach(record => {
                const d = new Date(record.updatedAt);
                const key = `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
                if (!dayMap[key]) {
                    dayMap[key] = { dateObj: d, totalItems: 0, totalRevenue: 0, byTransport: {} };
                }
                const day = dayMap[key];
                record.items.forEach(item => {
                    const fee = getItemFee(item.transport);
                    day.totalItems += 1;
                    day.totalRevenue += fee;
                    if (!day.byTransport[item.transport]) {
                        day.byTransport[item.transport] = { count: 0, revenue: 0 };
                    }
                    day.byTransport[item.transport].count += 1;
                    day.byTransport[item.transport].revenue += fee;
                });
            });

            const days = Object.values(dayMap).sort((a, b) => b.dateObj - a.dateObj);

            if (days.length === 0) {
                container.innerHTML = `

                                            ${record.status === 'active' ? `
                                                <button onclick="toggleItemStatus(${record.id}, ${item.originalIndex})" class="flex-shrink-0 w-6 h-6 rounded-full flex items-center justify-center border-2 ${item.isCompleted ? 'bg-green-500 border-green-500 text-white' : 'bg-white border-orange-300 text-transparent hover:border-green-400'} transition-colors shadow-sm focus:outline-none">
                                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" /></svg>
                                                </button>
                                            ` : `
                                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 ${item.isCompleted ? 'text-gray-400' : 'text-orange-400'}" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z" /></svg>
                                            `}
                                            <span class="font-medium flex-1 ${item.isCompleted ? 'text-gray-500 line-through' : 'text-orange-800'}">${escapeHtml(item.tracking) || 'ไม่มีเลขพัสดุ'}</span>
                                            ${!item.isCompleted && record.status === 'active' ? `<span class="text-xs font-bold text-orange-600 bg-orange-100 px-2 py-0.5 rounded">COD</span>` : ''}
                                        </li>
                                    `).join('')}
                                </ul>
                            </div>
                        `;
                    }

                    bodyHtml += `
                            </div>
                        </div>
                    `;
                }
            });
            bodyHtml += `</div>`;
            body.innerHTML = bodyHtml;

            if (record.status === 'active') {
                actions.innerHTML = `
                    <button onclick="openConfirmModal('ยืนยันการลบ', 'คุณต้องการลบและย้ายข้อมูลนี้ไปประวัติสถานะยกเลิก ใช่หรือไม่?', () => markStatus(${record.id}, 'deleted'))" class="px-4 py-2 flex items-center justify-center gap-1 bg-white border border-red-200 text-red-600 rounded-lg hover:bg-red-50 text-sm font-medium transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                        ลบ
                    </button>
                    <div class="flex-1"></div>
                    <button onclick="editRecord(${record.id})" class="px-4 py-2 flex items-center justify-center gap-1 bg-white border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 text-sm font-medium transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>
                        แก้ไข
                    </button>
                    <button onclick="openConfirmModal('รับของครบแล้ว?', 'ระบบจะย้ายข้อมูลไปยังหน้ารอส่งของ ยืนยันหรือไม่?', () => markStatus(${record.id}, 'pending'))" class="px-5 py-2 flex items-center justify-center gap-1 bg-yellow-500 text-white rounded-lg hover:bg-yellow-600 text-sm font-medium shadow-sm transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" /></svg>
                        รับของครบแล้ว
                    </button>
                `;
            } else if (record.status === 'pending') {
                actions.innerHTML = `
                    <button onclick="openConfirmModal('ย้อนกลับการแก้ไข', 'คุณต้องการย้อนกลับข้อมูลไปก่อนหน้านี้ ใช่หรือไม่?', () => markStatus(${record.id}, 'active'))" class="px-4 py-2 flex items-center justify-center gap-1 bg-white border border-blue-200 text-blue-600 rounded-lg hover:bg-blue-50 text-sm font-medium transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6" /></svg>
                        ย้อนกลับ (แก้ไข)
                    </button>
                    <div class="flex-1"></div>
                    <button onclick="openConfirmModal('ส่งพัสดุสำเร็จ', 'ผู้รับได้รับพัสดุเรียบร้อยแล้วและต้องการย้ายไปหน้าประวัติ ใช่หรือไม่?', () => markStatus(${record.id}, 'completed'))" class="px-5 py-2 flex items-center justify-center gap-1 bg-green-600 text-white rounded-lg hover:bg-green-700 text-sm font-medium shadow-sm transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" /></svg>
                        ส่งพัสดุสำเร็จ
                    </button>
                `;
            } else {
                actions.innerHTML = `
                    <button onclick="openConfirmModal('ย้อนกลับข้อมูล', 'คุณต้องการนำข้อมูลนี้กลับมาใช้งานอีกครั้ง ใช่หรือไม่?', () => markStatus(${record.id}, 'active'))" class="px-4 py-2 flex items-center justify-center gap-1 bg-white border border-blue-200 text-blue-600 rounded-lg hover:bg-blue-50 text-sm font-medium transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6" /></svg>
                        ย้อนกลับ (Undo)
                    </button>
                    <div class="flex-1"></div>
                    <button onclick="closeDetailModal()" class="px-5 py-2 flex items-center justify-center gap-1 bg-gray-200 text-gray-800 rounded-lg hover:bg-gray-300 text-sm font-medium transition-colors">
                        ปิด
                    </button>
                `;
            }

            modal.classList.remove('hidden');
            setTimeout(() => {
                content.classList.remove('scale-95', 'opacity-0');
            }, 10);
        }

        function closeDetailModal() {
            const modal = document.getElementById('detail-modal');
            const content = document.getElementById('detail-modal-content');

            content.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        function openFormModal() {
            currentEditingId = null;
            document.getElementById('form-modal-title').innerText = 'เพิ่มข้อมูลพัสดุ';
            formData = {
                name: '',
                lineLink: '',
                room: DORM_ROOMS[0],
                items: [{ tracking: '', transport: '', isCOD: false, isCompleted: false }]
            };

            updateFormUI();

            const modal = document.getElementById('form-modal');
            const content = document.getElementById('form-modal-content');
            modal.classList.remove('hidden');
            setTimeout(() => {
                content.classList.remove('scale-95', 'opacity-0');
            }, 10);
        }

        function editRecord(id) {
            const record = records.find(r => r.id === id);
            if (!record) return;

            closeDetailModal();

            currentEditingId = id;
            document.getElementById('form-modal-title').innerText = 'แก้ไขข้อมูลพัสดุ';

            formData = JSON.parse(JSON.stringify(record));
            if (formData.lineLink === undefined) formData.lineLink = '';

            updateFormUI();

            const modal = document.getElementById('form-modal');
            const content = document.getElementById('form-modal-content');
            modal.classList.remove('hidden');
            setTimeout(() => {
                content.classList.remove('scale-95', 'opacity-0');
            }, 10);
        }

        function closeFormModal() {
            const modal = document.getElementById('form-modal');
            const content = document.getElementById('form-modal-content');

            content.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        function updateFormUI() {
            document.getElementById('input-name').value = formData.name;
            document.getElementById('input-line').value = formData.lineLink || '';
            document.getElementById('input-room').value = formData.room;
            renderFormItems();
        }

        document.getElementById('input-name').addEventListener('input', (e) => formData.name = e.target.value);
        document.getElementById('input-line').addEventListener('input', (e) => formData.lineLink = e.target.value);
        document.getElementById('input-room').addEventListener('change', (e) => formData.room = e.target.value);

        function renderFormItems() {
            const container = document.getElementById('form-items-container');

            if (formData.items.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-4 text-sm text-gray-400 bg-gray-50 rounded-lg border border-dashed border-gray-300">
                        ยังไม่มีรายการพัสดุ กรุณากด "+ เพิ่มของ"
                    </div>`;
                return;
            }

            container.innerHTML = formData.items.map((item, index) => `
                <div class="bg-gray-50 border border-gray-200 p-4 rounded-xl relative">
                    <div class="absolute -top-3 -left-3 bg-blue-600 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold shadow-sm">
                        ${index + 1}
                    </div>
                    <button type="button" onclick="removeFormItem(${index})" class="absolute top-3 right-3 text-red-400 hover:text-red-600 transition-colors p-1 bg-white rounded-md shadow-sm border border-gray-100">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                    </button>

                    <div class="space-y-3 mt-2">
                        <div>
                            <label class="block text-xs font-medium text-gray-500 mb-1">เลขพัสดุ</label>
                            <input type="text" value="${escapeHtml(item.tracking)}" oninput="updateItemField(${index}, 'tracking', this.value)" class="w-full text-sm border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none bg-white uppercase" placeholder="กรอกเลขพัสดุ (ถ้ามี)">
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-medium text-gray-500 mb-1">ขนส่ง</label>
                                <select onchange="updateItemField(${index}, 'transport', this.value)" class="w-full text-sm border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none bg-white">
                                    <option value="" disabled ${!item.transport ? 'selected' : ''}>-- เลือกขนส่ง --</option>
                                    ${TRANSPORTS.map(t => `<option value="${t.id}" ${item.transport === t.id ? 'selected' : ''}>${t.name}</option>`).join('')}
                                </select>
                            </div>

                            <div>
                                <label class="block text-xs font-medium text-gray-500 mb-1">ประเภทจัดส่ง</label>
                                <select onchange="updateItemField(${index}, 'isCOD', this.value === 'true')" class="w-full text-sm border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none bg-white ${item.isCOD ? 'text-orange-600 font-semibold bg-orange-50 border-orange-200' : ''}">
                                    <option value="false" ${!item.isCOD ? 'selected' : ''}>ไม่ปลายทาง</option>
                                    <option value="true" ${item.isCOD ? 'selected' : ''}>ปลายทาง (COD)</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function addFormItem() {
            const validTransport = TRANSPORTS.some(t => t.id === currentTab) ? currentTab : 'flash';
            formData.items.push({ tracking: '', transport: validTransport, isCOD: false, isCompleted: false });
            renderFormItems();

            setTimeout(() => {
                const scrollArea = document.getElementById('form-scroll-area');
                scrollArea.scrollTo({ top: scrollArea.scrollHeight, behavior: 'smooth' });
            }, 50);
        }

        function removeFormItem(index) {
            formData.items.splice(index, 1);
            renderFormItems();
        }

        function updateItemField(index, field, value) {
            formData.items[index][field] = value;
            if(field === 'isCOD') renderFormItems();
        }

        async function saveRecord() {
            if (!formData.name.trim()) {
                showToast("กรุณากรอกชื่อ-นามสกุล", "error");
                document.getElementById('input-name').focus();
                return;
            }
            if (formData.items.length === 0) {
                showToast("กรุณาเพิ่มรายการพัสดุอย่างน้อย 1 รายการ", "error");
                return;
            }

            const missingTransport = formData.items.some(item => !item.transport);
            if (missingTransport) {
                showToast("กรุณาเลือกขนส่งให้ครบทุกรายการ", "error");
                return;
            }

            // Validate LINE link (optional field)
            const rawLine = (formData.lineLink || '').trim();
            const lineLink = rawLine ? normalizeLink(rawLine) : '';
            if (rawLine && !lineLink) {
                showToast("ลิงก์ไลน์ไม่ถูกต้อง", "error");
                document.getElementById('input-line').focus();
                return;
            }

            const timestamp = Date.now();

            if (currentEditingId) {
                const index = records.findIndex(r => r.id === currentEditingId);
                if (index !== -1) {
                    const fields = {
                        name: formData.name.trim(),
                        lineLink,
                        room: formData.room,
                        items: formData.items,
                        updatedAt: timestamp
                    };
                    records[index] = { ...records[index], ...fields };
                    showToast("แก้ไขข้อมูลสำเร็จ", "success");
                    closeFormModal();
                    await updateRecordOnServer(currentEditingId, fields);
                }
            } else {
                const newRecord = {
                    name: formData.name.trim(),
                    lineLink,
                    room: formData.room,
                    items: formData.items,
                    // extra random digits so two devices saving in the same ms don't clash
                    id: timestamp * 1000 + Math.floor(Math.random() * 1000),
                    status: 'active',
                    createdAt: timestamp,
                    updatedAt: timestamp
                };
                records.push(newRecord);
                showToast("บันทึกข้อมูลสำเร็จ", "success");
                closeFormModal();
                await createRecordOnServer(newRecord);
            }
        }

        async function toggleItemStatus(recordId, itemIndex) {
            const record = records.find(r => r.id === recordId);
            if (!record) return;

            record.items[itemIndex].isCompleted = !record.items[itemIndex].isCompleted;
            record.updatedAt = Date.now();

            const allCompleted = record.items.every(i => i.isCompleted);
            if (allCompleted) record.status = 'pending';

            const request = updateRecordOnServer(recordId, {
                items: record.items,
                status: record.status,
                updatedAt: record.updatedAt
            });

            if (allCompleted) {
                closeDetailModal();
                showToast("รับของครบทุกชิ้นแล้ว ย้ายไปยังหน้ารอส่งของ", "success");
            } else {
                openDetailModal(recordId);
            }

            await request;
        }

        async function markStatus(id, newStatus) {
            const record = records.find(r => r.id === id);
            if (!record) return;

            record.status = newStatus;
            record.updatedAt = Date.now();

            if (newStatus === 'completed') {
                record.items.forEach(item => item.isCompleted = true);
                showToast("ส่งพัสดุสำเร็จ ย้ายลงประวัติ", "success");
            } else if (newStatus === 'pending') {
                record.items.forEach(item => item.isCompleted = true);
                showToast("รับของครบแล้ว ย้ายไปหน้ารอส่งของ", "success");
            } else if (newStatus === 'active') {
                record.items.forEach(item => item.isCompleted = false);
                showToast("นำข้อมูลกลับมาใช้งานแล้ว", "info");
            } else if (newStatus === 'deleted') {
                showToast("ย้ายไปยังประวัติแล้ว", "info");
            }

            closeDetailModal();
            await updateRecordOnServer(id, {
                status: record.status,
                items: record.items,
                updatedAt: record.updatedAt
            });
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toastId = 'toast-' + Date.now() + '-' + Math.floor(Math.random() * 1000);

            let bgClass, icon;
            if (type === 'success') {
                bgClass = 'bg-green-600';
                icon = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>';
            } else if (type === 'error') {
                bgClass = 'bg-red-600';
                icon = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>';
            } else {
                bgClass = 'bg-gray-800';
                icon = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>';
            }

            const toastHTML = `
                <div id="${toastId}" class="${bgClass} text-white px-4 py-3 rounded-lg shadow-lg flex items-center gap-2 toast-show text-sm font-medium">
                    ${icon}
                    ${message}
                </div>
            `;

            container.insertAdjacentHTML('beforeend', toastHTML);

            const toastElement = document.getElementById(toastId);

            setTimeout(() => {
                toastElement.classList.remove('toast-show');
                toastElement.classList.add('toast-hide');
                setTimeout(() => {
                    toastElement.remove();
                }, 300);
            }, 3000);
        }

        document.getElementById('detail-modal').addEventListener('click', function(e) {
            if(e.target === this) closeDetailModal();
        });
        document.getElementById('form-modal').addEventListener('click', function(e) {
            if(e.target === this) closeFormModal();
        });
        document.getElementById('confirm-modal').addEventListener('click', function(e) {
            if(e.target === this) closeConfirmModal();
        });

        document.addEventListener('click', function(e) {
            if (!mobileMenuOpen) return;
            const menu = document.getElementById('mobile-menu');
            const hamburgerBtn = document.getElementById('hamburger-btn');
            if (!menu.contains(e.target) && !hamburgerBtn.contains(e.target)) {
                closeMobileMenu();
            }
        });

        let confirmActionCallback = null;

        function openConfirmModal(title, message, callback) {
            document.getElementById('confirm-title').innerText = title;
            document.getElementById('confirm-message').innerText = message;
            confirmActionCallback = callback;

            const btn = document.getElementById('btn-confirm-action');
            btn.onclick = function() {
                if(confirmActionCallback) confirmActionCallback();
                closeConfirmModal();
            };

            const modal = document.getElementById('confirm-modal');
            const content = document.getElementById('confirm-modal-content');
            modal.classList.remove('hidden');
            setTimeout(() => {
                content.classList.remove('scale-95', 'opacity-0');
            }, 10);
        }

        function closeConfirmModal() {
            const modal = document.getElementById('confirm-modal');
            const content = document.getElementById('confirm-modal-content');
            content.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        (function setupPullToRefresh() {
            const container = document.getElementById('main-content');
            const indicator = document.getElementById('pull-refresh-indicator');
            const icon = document.getElementById('pull-refresh-icon');
            const THRESHOLD = 70;
            const MAX_PULL = 100;

            let startY = 0;
            let pullDistance = 0;
            let pulling = false;
            let refreshing = false;

            container.addEventListener('touchstart', (e) => {
                if (refreshing) return;
                if (container.scrollTop <= 0) {
                    startY = e.touches[0].clientY;
                    pulling = true;
                } else {
                    pulling = false;
                }
            }, { passive: true });

            container.addEventListener('touchmove', (e) => {
                if (!pulling || refreshing) return;
                const deltaY = e.touches[0].clientY - startY;
                if (deltaY <= 0) {
                    pullDistance = 0;
                    indicator.style.opacity = '0';
                    indicator.classList.add('hidden');
                    return;
                }
                pullDistance = Math.min(deltaY * 0.5, MAX_PULL);
                indicator.classList.remove('hidden');
                indicator.style.transform = `translateY(${pullDistance}px)`;
                indicator.style.opacity = String(Math.min(pullDistance / THRESHOLD, 1));
            }, { passive: true });

            container.addEventListener('touchend', async () => {
                if (!pulling || refreshing) { pulling = false; return; }
                pulling = false;

                if (pullDistance >= THRESHOLD) {
                    refreshing = true;
                    icon.classList.add('animate-spin');
                    indicator.style.transform = `translateY(${THRESHOLD}px)`;
                    indicator.style.opacity = '1';

                    await loadData();
                    renderApp();

                    icon.classList.remove('animate-spin');
                    refreshing = false;
                }

                pullDistance = 0;
                indicator.style.transform = 'translateY(0px)';
                indicator.style.opacity = '0';
                setTimeout(() => indicator.classList.add('hidden'), 200);
            });
        })();

        window.addEventListener('DOMContentLoaded', initApp);

    </script>
</body>
</html>
