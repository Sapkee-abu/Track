<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการพัสดุหอพัก</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Sarabun', 'system-ui', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        :root { --bg: #F3F5F9; }
        body {
            background-color: var(--bg);
            -webkit-tap-highlight-color: transparent;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d5dbe5; border-radius: 10px; }
        .hide-scroll { scrollbar-width: none; }
        .hide-scroll::-webkit-scrollbar { display: none; }

        /* Soft card used for every list group */
        .card {
            background: #fff;
            border-radius: 24px;
            box-shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 6px 20px rgba(16, 24, 40, .04);
        }

        /* Soft rounded form fields */
        .field {
            width: 100%;
            background: #F3F5F9;
            border: 1px solid transparent;
            border-radius: 16px;
            padding: 12px 16px;
            font-size: 15px;
            outline: none;
            transition: background .15s, border-color .15s, box-shadow .15s;
        }
        .field:focus {
            background: #fff;
            border-color: #bfd3fb;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, .12);
        }
        .field-white { background: #fff; }

        @keyframes slideIn {
            from { transform: translateY(-8px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
        .toast-show { animation: slideIn .25s ease-out forwards; }
        .toast-hide { animation: fadeOut .25s forwards; }

        /* History rows: long-press to select */
        [data-history-id] {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            transition: background-color .15s, transform .45s ease-out;
        }
        [data-history-id].pressing {
            background-color: #FEF2F2;
            transform: scale(.97);
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { transition: none !important; animation: none !important; }
        }
    </style>
</head>
<body class="text-gray-800 antialiased h-screen flex flex-col overflow-hidden">

    <header class="bg-white/90 backdrop-blur z-10 relative shadow-[0_1px_0_rgba(16,24,40,.05)]">
        <div class="max-w-3xl mx-auto w-full px-4 pt-3 pb-2 flex items-center justify-between">
            <div class="flex items-center gap-2.5">
                <button onclick="toggleMobileMenu()" id="hamburger-btn" class="hidden max-[850px]:flex w-10 h-10 -ml-1 items-center justify-center rounded-full text-gray-500 hover:bg-gray-100 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-200" title="เมนู" aria-label="เมนู">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7h16M4 12h16M4 17h10" /></svg>
                </button>
                <div class="w-9 h-9 rounded-2xl bg-blue-50 flex items-center justify-center text-lg">📦</div>
                <h1 class="text-base font-semibold text-gray-800">พัสดุหอพัก</h1>
            </div>
            <button onclick="refreshData()" id="refresh-btn" class="w-10 h-10 flex items-center justify-center rounded-full text-gray-500 hover:bg-gray-100 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-200" title="รีเฟรชข้อมูล" aria-label="รีเฟรชข้อมูล">
                <svg xmlns="http://www.w3.org/2000/svg" id="refresh-icon" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
            </button>
        </div>
        <!-- Pill tabs (desktop); built from TABS in JS -->
        <nav id="tabs-container" class="max-[850px]:hidden max-w-3xl mx-auto w-full flex gap-1.5 overflow-x-auto hide-scroll px-4 pb-3"></nav>
        <!-- Mobile dropdown menu -->
        <div id="mobile-menu" class="hidden absolute top-full left-3 right-3 mt-2 bg-white rounded-3xl shadow-xl p-2 z-30 flex-col gap-0.5"></div>
    </header>

    <div id="pull-refresh-indicator" class="hidden fixed left-1/2 -translate-x-1/2 z-40 bg-white rounded-full shadow-md p-2" style="top: 8px; opacity: 0; transition: opacity 0.15s;">
        <svg id="pull-refresh-icon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
    </div>

    <main class="flex-1 overflow-y-auto relative" id="main-content">
        <div id="page" class="max-w-3xl mx-auto px-4 pt-4 pb-28"></div>
    </main>

    <!-- Floating add button -->
    <button id="fab" onclick="openFormModal()" class="fixed bottom-6 right-6 w-14 h-14 bg-blue-600 text-white rounded-full shadow-lg shadow-blue-600/30 hover:bg-blue-700 transition-colors z-20 focus:outline-none focus-visible:ring-4 focus-visible:ring-blue-200 flex items-center justify-center" aria-label="เพิ่มข้อมูลพัสดุ">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M12 5v14m7-7H5" /></svg>
    </button>

    <!-- Detail modal -->
    <div id="detail-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-gray-900/30 backdrop-blur-sm p-4">
        <div class="bg-white rounded-[28px] shadow-2xl w-full max-w-lg max-h-[90vh] flex flex-col overflow-hidden transform scale-95 opacity-0 transition-all duration-200" id="detail-modal-content">
            <div class="px-5 pt-4 pb-1 flex justify-between items-center">
                <div class="flex items-center gap-1 min-w-0">
                    <button id="detail-back-btn" class="hidden w-9 h-9 -ml-2 items-center justify-center rounded-full text-gray-500 hover:bg-gray-100 transition-colors" aria-label="กลับ">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg>
                    </button>
                    <h3 id="detail-modal-title" class="text-sm font-medium text-gray-400 truncate">รายละเอียดพัสดุ</h3>
                </div>
                <button onclick="closeDetailModal()" class="w-9 h-9 flex items-center justify-center rounded-full text-gray-400 hover:bg-gray-100 hover:text-gray-600 transition-colors" aria-label="ปิด">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                </button>
            </div>
            <div class="px-5 pb-4 overflow-y-auto flex-1" id="detail-modal-body"></div>
            <div class="px-5 py-4 flex flex-wrap gap-2 justify-end border-t border-gray-100" id="detail-modal-actions"></div>
        </div>
    </div>

    <!-- Form modal -->
    <div id="form-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-gray-900/30 backdrop-blur-sm p-4">
        <div class="bg-white rounded-[28px] shadow-2xl w-full max-w-lg max-h-[95vh] flex flex-col overflow-hidden transform scale-95 opacity-0 transition-all duration-200" id="form-modal-content">
            <div class="px-6 pt-5 pb-2 flex justify-between items-center">
                <h3 class="text-lg font-semibold text-gray-800" id="form-modal-title">เพิ่มข้อมูลพัสดุ</h3>
                <button onclick="closeFormModal()" class="w-9 h-9 flex items-center justify-center rounded-full text-gray-400 hover:bg-gray-100 hover:text-gray-600 transition-colors" aria-label="ปิด">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                </button>
            </div>

            <div class="px-6 py-3 overflow-y-auto flex-1" id="form-scroll-area">
                <div class="space-y-4">
                    <div>
                        <label for="input-name" class="block text-sm text-gray-500 mb-1.5 ml-1">ชื่อ-นามสกุล</label>
                        <input type="text" id="input-name" class="field" placeholder="กรอกชื่อ นามสกุล">
                    </div>

                    <div>
                        <label for="input-line" class="block text-sm text-gray-500 mb-1.5 ml-1">ชื่อไลน์ <span class="text-gray-400">(ถ้ามี)</span></label>
                        <input type="text" id="input-line" maxlength="100" autocapitalize="off" autocorrect="off" class="field" placeholder="กรอกชื่อไลน์">
                    </div>

                    <div>
                        <label for="input-room" class="block text-sm text-gray-500 mb-1.5 ml-1">เลขหอพัก</label>
                        <select id="input-room" class="field"></select>
                    </div>

                    <div class="pt-2">
                        <div class="flex justify-between items-center mb-3">
                            <span class="text-sm text-gray-500 ml-1">รายการพัสดุ</span>
                            <button type="button" onclick="addFormItem()" class="text-sm bg-blue-50 text-blue-700 pl-2.5 pr-3.5 py-1.5 rounded-full font-medium hover:bg-blue-100 transition-colors flex items-center gap-1">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v14m7-7H5" /></svg>
                                เพิ่มของ
                            </button>
                        </div>
                        <div id="form-items-container" class="space-y-3"></div>
                    </div>
                </div>
            </div>

            <div class="px-6 py-4 flex gap-2 justify-end border-t border-gray-100">
                <button type="button" onclick="closeFormModal()" class="px-5 py-2.5 rounded-full text-sm font-medium text-gray-600 bg-gray-100 hover:bg-gray-200 transition-colors">ยกเลิก</button>
                <button type="button" onclick="saveRecord()" class="px-5 py-2.5 rounded-full text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 transition-colors">บันทึกข้อมูล</button>
            </div>
        </div>
    </div>

    <!-- Confirm modal -->
    <div id="confirm-modal" class="fixed inset-0 z-[70] hidden flex items-center justify-center bg-gray-900/30 backdrop-blur-sm p-4">
        <div class="bg-white rounded-[28px] shadow-2xl w-full max-w-sm overflow-hidden transform scale-95 opacity-0 transition-all duration-200" id="confirm-modal-content">
            <div class="px-6 pt-7 pb-5 text-center">
                <h3 class="text-lg font-semibold text-gray-800 mb-1.5" id="confirm-title">ยืนยันการทำรายการ?</h3>
                <p class="text-gray-500 text-sm" id="confirm-message">คุณต้องการดำเนินการนี้ใช่หรือไม่?</p>
            </div>
            <div class="px-5 pb-5 flex gap-2">
                <button type="button" onclick="closeConfirmModal()" class="flex-1 py-2.5 rounded-full text-sm font-medium text-gray-600 bg-gray-100 hover:bg-gray-200 transition-colors">ยกเลิก</button>
                <button type="button" id="btn-confirm-action" class="flex-1 py-2.5 rounded-full text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 transition-colors">ยืนยัน</button>
            </div>
        </div>
    </div>

    <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-[80] flex flex-col items-center gap-2 pointer-events-none"></div>

    <script src="config.js"></script>
    <script>
        const DORM_ROOMS = ['1', '2', '3', '4', '5', '7', '13', '14', '15', '16', '17', '18', 'เรสA', 'เรสB', 'เรสC', 'เรสC2'];
        const TRANSPORTS = [
            { id: 'flash', name: 'Flash Express', colorClass: 'text-yellow-700', badgeClass: 'bg-yellow-100 text-yellow-800', icon: '⚡' },
            { id: 'jt', name: 'J&T Express', colorClass: 'text-red-600', badgeClass: 'bg-red-100 text-red-700', icon: '🔴' },
            { id: 'shopee', name: 'Shopee Express', colorClass: 'text-orange-600', badgeClass: 'bg-orange-100 text-orange-700', icon: '🟠' },
            { id: 'post', name: 'ไปรษณีย์ไทย', colorClass: 'text-red-700', badgeClass: 'bg-red-100 text-red-700', icon: '📮' }
        ];

        const TABS = [
            { id: 'all', label: 'ทั้งหมด', icon: '📋' },
            { id: 'flash', label: 'Flash Express', icon: '⚡' },
            { id: 'jt', label: 'J&T Express', icon: '🔴' },
            { id: 'shopee', label: 'Shopee Express', icon: '🟠' },
            { id: 'post', label: 'ไปรษณีย์ไทย', icon: '📮' },
            { id: 'pending', label: 'รอส่งของ', icon: '📦' },
            { id: 'history', label: 'ประวัติ', icon: '🕒' },
            { id: 'summary', label: 'สรุปยอด', icon: '💰' }
        ];

        const THAI_DAY_NAMES = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
        const THAI_MONTH_NAMES = [
            'มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน',
            'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'
        ];

        const ICON = {
            chevron: '<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>',
            check: '<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" /></svg>',
            copy: '<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><rect x="9" y="9" width="11" height="11" rx="3" stroke-width="2"/><path stroke-linecap="round" stroke-width="2" d="M15 9V7a3 3 0 00-3-3H7a3 3 0 00-3 3v5a3 3 0 003 3h2"/></svg>',
            search: '<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><circle cx="11" cy="11" r="7" stroke-width="2"/><path stroke-linecap="round" stroke-width="2" d="M20 20l-3.5-3.5"/></svg>',
            close: '<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>',
            trash: '<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>'
        };

        const BTN = {
            primary: 'px-5 py-2.5 rounded-full text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 transition-colors',
            amber: 'px-5 py-2.5 rounded-full text-sm font-medium text-white bg-amber-500 hover:bg-amber-600 transition-colors',
            green: 'px-5 py-2.5 rounded-full text-sm font-medium text-white bg-green-600 hover:bg-green-700 transition-colors',
            soft: 'px-4 py-2.5 rounded-full text-sm font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 transition-colors',
            softBlue: 'px-4 py-2.5 rounded-full text-sm font-medium text-blue-700 bg-blue-50 hover:bg-blue-100 transition-colors',
            softRed: 'px-4 py-2.5 rounded-full text-sm font-medium text-red-600 bg-red-50 hover:bg-red-100 transition-colors'
        };

        function getItemFee(transportId) {
            return transportId === 'post' ? 15 : 8;
        }

        const API_BASE_URL = window.API_BASE_URL || 'http://localhost:7860';

        let records = [];
        let currentTab = 'flash';
        let currentEditingId = null;
        let mobileMenuOpen = false;
        let formData = { name: '', lineName: '', room: DORM_ROOMS[0], items: [] };

        // Search text per tab, kept while switching tabs / refreshing
        const searchQueries = { pending: '', history: '' };

        // History selection (for deleting)
        let historySelectMode = false;
        let selectedHistoryIds = new Set();
        let rerenderHistoryList = null;

        // Summary: records grouped per day, used by the day-detail popup
        let summaryDays = {};

        // ---------- Helpers ----------

        function escapeHtml(str) {
            return String(str ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function getTransportData(transportId) {
            return TRANSPORTS.find(t => t.id === transportId);
        }

        function groupByRoom(list) {
            const grouped = {};
            list.forEach(record => {
                if (!grouped[record.room]) grouped[record.room] = [];
                grouped[record.room].push(record);
            });
            return grouped;
        }

        // Matches name, LINE name, room and tracking numbers.
        // Several words = all must match (e.g. "หอ 5 สมชาย").
        function matchesQuery(record, query) {
            const q = query.trim().toLowerCase();
            if (!q) return true;
            const haystack = [
                record.name,
                record.lineName,
                `หอ ${record.room}`,
                `หอพัก ${record.room}`,
                ...record.items.map(i => i.tracking)
            ].join(' ').toLowerCase();
            return q.split(/\s+/).every(word => haystack.includes(word));
        }

        function countBadge(text, cls = 'bg-gray-100 text-gray-500') {
            return `<span class="text-xs px-2.5 py-1 rounded-full ${cls}">${text}</span>`;
        }

        function emptyState(emoji, text) {
            return `
                <div class="flex flex-col items-center text-center text-gray-400 py-16">
                    <div class="w-16 h-16 rounded-full bg-white shadow-sm flex items-center justify-center text-2xl mb-3">${emoji}</div>
                    <p class="text-base">${text}</p>
                </div>`;
        }

        function recordRow(record, rightHtml, subHtml = '', hover = 'hover:bg-gray-50') {
            return `
                <button onclick="openDetailModal(${record.id})" class="w-full text-left px-3 py-3 rounded-2xl ${hover} transition-colors flex justify-between items-center gap-3 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-200">
                    <div class="min-w-0">
                        <div class="font-medium text-gray-800 truncate">${escapeHtml(record.name)}</div>
                        ${subHtml}
                    </div>
                    <div class="flex items-center gap-2 flex-shrink-0">${rightHtml}${ICON.chevron}</div>
                </button>`;
        }

        function roomCards(list, rowFn, tone = 'blue') {
            const grouped = groupByRoom(list);
            const chip = tone === 'amber' ? 'bg-amber-100 text-amber-800' : 'bg-blue-50 text-blue-700';
            return '<div class="space-y-4">' + DORM_ROOMS
                .filter(room => grouped[room] && grouped[room].length > 0)
                .map(room => `
                    <section class="card p-2">
                        <div class="flex items-center justify-between px-3 pt-2 pb-1.5">
                            <span class="text-sm font-semibold px-3 py-1 rounded-full ${chip}">หอพัก ${escapeHtml(room)}</span>
                            <span class="text-xs text-gray-400">${grouped[room].length} คน</span>
                        </div>
                        <div class="space-y-0.5">${grouped[room].map(rowFn).join('')}</div>
                    </section>
                `).join('') + '</div>';
        }

        // Search box shown at the top of a tab. Only the list below it is
        // re-rendered while typing, so the input keeps focus (works with Thai IME).
        function renderSearchableTab(container, tabId, placeholder, renderList) {
            const q = searchQueries[tabId] || '';
            container.innerHTML = `
                <div class="sticky top-0 z-[5] -mx-4 px-4 pt-1 pb-3" style="background: var(--bg);">
                    <div class="relative">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">${ICON.search}</span>
                        <input id="search-input" type="text" enterkeyhint="search" autocomplete="off"
                               value="${escapeHtml(q)}" placeholder="${escapeHtml(placeholder)}"
                               class="w-full bg-white rounded-full pl-12 pr-11 py-3 text-[15px] shadow-[0_1px_2px_rgba(16,24,40,.05)] outline-none border border-transparent focus:border-blue-200 focus:ring-4 focus:ring-blue-100 transition">
                        <button id="search-clear" type="button" aria-label="ล้างคำค้นหา"
                                class="${q ? '' : 'hidden'} absolute right-2 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full flex items-center justify-center text-gray-400 hover:bg-gray-100 hover:text-gray-600 transition-colors">${ICON.close}</button>
                    </div>
                </div>
                <div id="list-area"></div>`;

            const input = container.querySelector('#search-input');
            const clearBtn = container.querySelector('#search-clear');
            const listArea = container.querySelector('#list-area');

            input.addEventListener('input', () => {
                searchQueries[tabId] = input.value;
                clearBtn.classList.toggle('hidden', !input.value);
                renderList(listArea, input.value);
            });
            clearBtn.addEventListener('click', () => {
                input.value = '';
                searchQueries[tabId] = '';
                clearBtn.classList.add('hidden');
                renderList(listArea, '');
                input.focus();
            });

            renderList(listArea, q);
        }

        function searchResultInfo(count, query) {
            if (!query.trim()) return '';
            return `<p class="text-xs text-gray-400 mb-3 ml-2">พบ ${count} รายการ</p>`;
        }

        // ---------- Server sync ----------

        async function loadData() {
            try {
                const res = await fetch(`${API_BASE_URL}/api/records`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                records = await res.json();
            } catch (e) {
                console.error("Error loading data from server", e);
                showToast("โหลดข้อมูลจากเซิร์ฟเวอร์ไม่สำเร็จ", "error");
            }
        }

        async function refreshData() {
            const icon = document.getElementById('refresh-icon');
            const btn = document.getElementById('refresh-btn');
            icon.classList.add('animate-spin');
            btn.disabled = true;

            await loadData();
            renderApp();

            icon.classList.remove('animate-spin');
            btn.disabled = false;
        }

        async function apiRequest(method, path, body) {
            const res = await fetch(`${API_BASE_URL}${path}`, {
                method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return res.json();
        }

        // Sends only the ONE record that changed, so devices don't overwrite each other.
        function syncRecord(requestPromise) {
            renderApp();
            return requestPromise
                .then((saved) => {
                    const i = records.findIndex(r => r.id === saved.id);
                    if (i !== -1) records[i] = saved;
                    else records.push(saved);
                })
                .catch(async (e) => {
                    console.error("Error saving data to server", e);
                    showToast("บันทึกข้อมูลไปเซิร์ฟเวอร์ไม่สำเร็จ", "error");
                    await loadData();
                    renderApp();
                });
        }

        function createRecordOnServer(record) {
            return syncRecord(apiRequest('POST', '/api/records', record));
        }

        function updateRecordOnServer(id, fields) {
            return syncRecord(apiRequest('PATCH', `/api/records/${id}`, fields));
        }

        // ---------- App shell ----------

        async function initApp() {
            await loadData();

            document.getElementById('input-room').innerHTML =
                DORM_ROOMS.map(room => `<option value="${room}">${room}</option>`).join('');

            renderTabs();
            renderApp();
        }

        function renderTabs() {
            document.getElementById('tabs-container').innerHTML = TABS.map(tab => `
                <button onclick="switchTab('${tab.id}')" class="flex-shrink-0 px-4 py-2 rounded-full text-sm whitespace-nowrap transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-200 ${tab.id === currentTab ? 'bg-blue-600 text-white font-medium' : 'text-gray-500 hover:bg-gray-100'}">
                    ${tab.icon} ${tab.label}
                </button>
            `).join('');

            document.getElementById('mobile-menu').innerHTML = TABS.map(tab => `
                <button onclick="switchTab('${tab.id}')" class="w-full text-left px-4 py-3 rounded-2xl text-sm transition-colors focus:outline-none ${tab.id === currentTab ? 'bg-blue-50 text-blue-700 font-semibold' : 'text-gray-600 hover:bg-gray-50'}">
                    ${tab.icon} ${tab.label}
                </button>
            `).join('');
        }

        function toggleMobileMenu() {
            mobileMenuOpen = !mobileMenuOpen;
            const menu = document.getElementById('mobile-menu');
            menu.classList.toggle('hidden', !mobileMenuOpen);
            menu.classList.toggle('flex', mobileMenuOpen);
        }

        function closeMobileMenu() {
            mobileMenuOpen = false;
            const menu = document.getElementById('mobile-menu');
            menu.classList.add('hidden');
            menu.classList.remove('flex');
        }

        function switchTab(tabId) {
            currentTab = tabId;
            exitHistorySelectMode(false);
            renderTabs();
            closeMobileMenu();
            document.getElementById('main-content').scrollTop = 0;
            renderApp();
        }

        function renderApp() {
            const page = document.getElementById('page');

            if (currentTab === 'all') renderAllTab(page);
            else if (currentTab === 'history') renderHistory(page);
            else if (currentTab === 'pending') renderPending(page);
            else if (currentTab === 'summary') renderSummaryTab(page);
            else renderTransportTab(page, currentTab);
        }

        // ---------- Tabs ----------

        function dayKeyOf(ts) {
            const d = new Date(ts);
            return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
        }

        function thaiDateLong(d) {
            return `วัน${THAI_DAY_NAMES[d.getDay()]}ที่ ${d.getDate()} ${THAI_MONTH_NAMES[d.getMonth()]} ${d.getFullYear() + 543}`;
        }

        function renderSummaryTab(container) {
            const completedRecords = records.filter(r => r.status === 'completed');

            summaryDays = {};
            completedRecords.forEach(record => {
                const key = dayKeyOf(record.updatedAt);
                if (!summaryDays[key]) {
                    summaryDays[key] = { key, dateObj: new Date(record.updatedAt), totalItems: 0, totalRevenue: 0, byTransport: {}, records: [] };
                }
                const day = summaryDays[key];
                day.records.push(record);
                record.items.forEach(item => {
                    const fee = getItemFee(item.transport);
                    day.totalItems += 1;
                    day.totalRevenue += fee;
                    if (!day.byTransport[item.transport]) day.byTransport[item.transport] = { count: 0, revenue: 0 };
                    day.byTransport[item.transport].count += 1;
                    day.byTransport[item.transport].revenue += fee;
                });
            });

            const days = Object.values(summaryDays).sort((a, b) => b.dateObj - a.dateObj);

            if (days.length === 0) {
                container.innerHTML = emptyState('💰', 'ยังไม่มีพัสดุที่ส่งสำเร็จ');
                return;
            }

            const grandTotalRevenue = days.reduce((sum, d) => sum + d.totalRevenue, 0);
            const grandTotalItems = days.reduce((sum, d) => sum + d.totalItems, 0);

            let html = `
                <div class="space-y-4">
                    <div class="card px-6 py-5">
                        <p class="text-sm text-gray-400">ยอดรวมที่ส่งสำเร็จ</p>
                        <p class="text-3xl font-semibold text-gray-900 mt-1">${grandTotalRevenue.toLocaleString()} <span class="text-lg font-normal text-gray-400">บาท</span></p>
                        <p class="text-sm text-gray-500 mt-1">${grandTotalItems.toLocaleString()} ชิ้น</p>
                    </div>
            `;

            days.forEach(day => {
                const transportRows = TRANSPORTS
                    .filter(t => day.byTransport[t.id])
                    .map(t => {
                        const data = day.byTransport[t.id];
                        return `
                            <div class="grid grid-cols-3 items-center text-sm px-3 py-2">
                                <span class="text-gray-600">${t.icon} ${t.name}</span>
                                <span class="text-gray-400 text-center">${data.count} × ${getItemFee(t.id)}</span>
                                <span class="font-medium text-gray-800 text-right">${data.revenue.toLocaleString()} บาท</span>
                            </div>`;
                    }).join('');

                html += `
                    <button onclick="openDayDetail('${day.key}')" class="card p-2 w-full text-left block hover:shadow-md transition-shadow focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-200">
                        <div class="flex justify-between items-center px-3 pt-2 pb-1">
                            <span class="font-medium text-gray-700">${thaiDateLong(day.dateObj)}</span>
                            <span class="font-semibold text-blue-600">${day.totalRevenue.toLocaleString()} บาท</span>
                        </div>
                        ${transportRows}
                        <div class="mx-1 mt-1 px-3 py-2 rounded-2xl bg-gray-50 flex justify-between items-center text-sm text-gray-500">
                            <span>รวม ${day.totalItems} ชิ้น จาก ${day.records.length} คน</span>
                            <span class="flex items-center gap-0.5 text-blue-600 font-medium">ดูรายละเอียด ${ICON.chevron.replace('text-gray-300', 'text-blue-400')}</span>
                        </div>
                    </button>`;
            });

            html += '</div>';
            container.innerHTML = html;
        }

        // Popup: who got parcels on that day, how many pieces each, how much.
        function openDayDetail(key) {
            const day = summaryDays[key];
            if (!day) return;

            const roomOrder = room => { const i = DORM_ROOMS.indexOf(room); return i === -1 ? 999 : i; };
            const people = [...day.records].sort((a, b) =>
                roomOrder(a.room) - roomOrder(b.room) || a.name.localeCompare(b.name, 'th'));

            const chips = TRANSPORTS
                .filter(t => day.byTransport[t.id])
                .map(t => `<span class="text-xs px-2.5 py-1 rounded-full ${t.badgeClass}">${t.icon} ${day.byTransport[t.id].count} ชิ้น</span>`)
                .join('');

            const rows = people.map(record => {
                const count = record.items.length;
                const revenue = record.items.reduce((sum, i) => sum + getItemFee(i.transport), 0);
                const perTransport = TRANSPORTS
                    .map(t => ({ t, n: record.items.filter(i => i.transport === t.id).length }))
                    .filter(x => x.n > 0)
                    .map(x => `${x.t.icon} ${x.n}`)
                    .join('  ');
                const d = new Date(record.updatedAt);
                const time = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
                return `
                    <li>
                        <button onclick="openDetailModal(${record.id}, '${key}')" class="w-full text-left bg-gray-50 hover:bg-gray-100 rounded-2xl px-4 py-3 flex items-center justify-between gap-3 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-200">
                            <div class="min-w-0">
                                <div class="font-medium text-gray-800 truncate">${escapeHtml(record.name)}</div>
                                <div class="text-xs text-gray-400 mt-0.5 truncate">หอพัก ${escapeHtml(record.room)} เวลา ${time}${record.lineName ? ` · LINE ${escapeHtml(record.lineName)}` : ''}</div>
                                <div class="text-xs text-gray-500 mt-1">${perTransport}</div>
                            </div>
                            <div class="text-right flex-shrink-0">
                                <div class="text-sm font-semibold text-gray-800">${count} ชิ้น</div>
                                <div class="text-xs text-gray-400">${revenue.toLocaleString()} บาท</div>
                            </div>
                        </button>
                    </li>`;
            }).join('');

            document.getElementById('detail-modal-title').innerText = 'สรุปยอดรายวัน';
            setDetailBack(null);
            document.getElementById('detail-modal-body').innerHTML = `
                <div class="text-center pt-1 mb-4">
                    <p class="text-sm text-gray-500">${thaiDateLong(day.dateObj)}</p>
                    <p class="text-3xl font-semibold text-gray-900 mt-1">${day.totalRevenue.toLocaleString()} <span class="text-lg font-normal text-gray-400">บาท</span></p>
                    <p class="text-sm text-gray-500 mt-1">${day.totalItems} ชิ้น จาก ${people.length} คน</p>
                    <div class="flex flex-wrap justify-center gap-1.5 mt-3">${chips}</div>
                </div>
                <ul class="space-y-2">${rows}</ul>`;
            document.getElementById('detail-modal-actions').innerHTML =
                `<button onclick="closeDetailModal()" class="${BTN.soft}">ปิด</button>`;

            showDetailModal();
        }

        function renderAllTab(container) {
            const activeRecords = records.filter(r => r.status === 'active');
            if (activeRecords.length === 0) {
                container.innerHTML = emptyState('📭', 'ไม่มีพัสดุที่กำลังดำเนินการ');
                return;
            }
            container.innerHTML = roomCards(activeRecords, record => {
                const remaining = record.items.filter(i => !i.isCompleted);
                const icons = [...new Set(remaining.map(i => i.transport))]
                    .map(id => getTransportData(id)?.icon || '').join(' ');
                return recordRow(record, `<span class="text-sm">${icons}</span>${countBadge(`${remaining.length} ชิ้น`)}`);
            });
        }

        function renderTransportTab(container, transportId) {
            const activeRecords = records.filter(r =>
                r.status === 'active' &&
                r.items.some(item => item.transport === transportId && !item.isCompleted)
            );
            if (activeRecords.length === 0) {
                container.innerHTML = emptyState('📭', 'ไม่มีพัสดุหมวดหมู่นี้');
                return;
            }
            container.innerHTML = roomCards(activeRecords, record => {
                const count = record.items.filter(i => i.transport === transportId && !i.isCompleted).length;
                return recordRow(record, countBadge(`${count} ชิ้น`));
            });
        }

        function renderPending(container) {
            const pendingRecords = records.filter(r => r.status === 'pending');

            renderSearchableTab(container, 'pending', 'ค้นหาชื่อ ชื่อไลน์ หอ หรือเลขพัสดุ', (area, query) => {
                if (pendingRecords.length === 0) {
                    area.innerHTML = emptyState('📦', 'ไม่มีพัสดุที่รอส่ง');
                    return;
                }
                const filtered = pendingRecords.filter(r => matchesQuery(r, query));
                if (filtered.length === 0) {
                    area.innerHTML = emptyState('🔍', `ไม่พบรายการที่ตรงกับ “${escapeHtml(query.trim())}”`);
                    return;
                }
                area.innerHTML = searchResultInfo(filtered.length, query) + roomCards(filtered, record =>
                    recordRow(record, countBadge(`ครบ ${record.items.length} ชิ้น`, 'bg-amber-100 text-amber-800'), '', 'hover:bg-amber-50'),
                    'amber'
                );
            });
        }

        function historyRow(record) {
            const isCompleted = record.status === 'completed';
            const status = isCompleted
                ? countBadge('เสร็จสิ้น', 'bg-green-50 text-green-700')
                : countBadge('ยกเลิก/ลบ', 'bg-red-50 text-red-600');
            const d = new Date(record.updatedAt);
            const dateStr = `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear() + 543} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
            const sub = `<div class="text-xs text-gray-400 mt-0.5">${dateStr}</div>`;

            if (!historySelectMode) {
                return recordRow(record, status, sub).replace('<button ', `<button data-history-id="${record.id}" `);
            }

            const checked = selectedHistoryIds.has(record.id);
            return `
                <button onclick="toggleHistorySelect(${record.id})" aria-pressed="${checked}" class="w-full text-left px-3 py-3 rounded-2xl ${checked ? 'bg-red-50' : 'hover:bg-gray-50'} transition-colors flex items-center gap-3 focus:outline-none focus-visible:ring-2 focus-visible:ring-red-200">
                    <span class="flex-shrink-0 w-6 h-6 rounded-full border-2 flex items-center justify-center ${checked ? 'bg-red-500 border-red-500 text-white' : 'border-gray-300 text-transparent'}">${ICON.check}</span>
                    <div class="min-w-0 flex-1">
                        <div class="font-medium text-gray-800 truncate">${escapeHtml(record.name)}</div>
                        ${sub}
                    </div>
                    ${status}
                </button>`;
        }

        function renderHistory(container) {
            const historyRecords = records
                .filter(r => r.status === 'completed' || r.status === 'deleted')
                .sort((a, b) => b.updatedAt - a.updatedAt);

            renderSearchableTab(container, 'history', 'ค้นหาชื่อ ชื่อไลน์ หอ หรือเลขพัสดุ', (area, query) => {
                rerenderHistoryList = () => {
                    if (historyRecords.length === 0) {
                        exitHistorySelectMode(false);
                        area.innerHTML = emptyState('🕒', 'ยังไม่มีประวัติการทำรายการ');
                        return;
                    }

                    const q = searchQueries.history;
                    const filtered = historyRecords.filter(r => matchesQuery(r, q));

                    // Only keep selections that are still visible
                    const visibleIds = new Set(filtered.map(r => r.id));
                    selectedHistoryIds = new Set([...selectedHistoryIds].filter(id => visibleIds.has(id)));

                    const allSelected = filtered.length > 0 && filtered.every(r => selectedHistoryIds.has(r.id));

                    const toolbar = historySelectMode ? `
                        <div class="card px-3 py-2 mb-3 flex items-center gap-2">
                            <button onclick="toggleSelectAllHistory()" class="flex items-center gap-2 px-2 py-1.5 rounded-full hover:bg-gray-50 text-sm text-gray-700 focus:outline-none">
                                <span class="w-6 h-6 rounded-full border-2 flex items-center justify-center ${allSelected ? 'bg-red-500 border-red-500 text-white' : 'border-gray-300 text-transparent'}">${ICON.check}</span>
                                เลือกทั้งหมด${q.trim() ? 'ที่ค้นเจอ' : ''}
                            </button>
                            <span class="ml-auto text-sm text-gray-400">เลือก ${selectedHistoryIds.size}</span>
                            <button onclick="exitHistorySelectMode()" class="${BTN.soft} !py-1.5">ยกเลิก</button>
                        </div>` : `
                        <div class="flex items-center justify-between mb-3 px-1">
                            <span class="text-xs text-gray-400">${q.trim() ? `พบ ${filtered.length} รายการ` : `ทั้งหมด ${historyRecords.length} รายการ`} <span class="max-[400px]:hidden">· กดค้างที่รายการเพื่อเลือก</span></span>
                            <button onclick="enterHistorySelectMode()" class="flex items-center gap-1 text-sm text-red-600 bg-red-50 hover:bg-red-100 px-3.5 py-1.5 rounded-full transition-colors">${ICON.trash} ลบประวัติ</button>
                        </div>`;

                    if (filtered.length === 0) {
                        area.innerHTML = toolbar + emptyState('🔍', `ไม่พบรายการที่ตรงกับ “${escapeHtml(q.trim())}”`);
                    } else {
                        area.innerHTML = toolbar + roomCards(filtered, historyRow);
                    }
                    updateDeleteBar();
                };
                rerenderHistoryList();
            });
        }

        function enterHistorySelectMode(preselectId = null) {
            historySelectMode = true;
            selectedHistoryIds = new Set(preselectId != null ? [preselectId] : []);
            document.getElementById('fab').classList.add('hidden');
            if (rerenderHistoryList) rerenderHistoryList();
        }

        function exitHistorySelectMode(rerender = true) {
            historySelectMode = false;
            selectedHistoryIds = new Set();
            document.getElementById('fab').classList.remove('hidden');
            updateDeleteBar();
            if (rerender && rerenderHistoryList && currentTab === 'history') rerenderHistoryList();
        }

        function toggleHistorySelect(id) {
            if (selectedHistoryIds.has(id)) selectedHistoryIds.delete(id);
            else selectedHistoryIds.add(id);
            rerenderHistoryList();
        }

        function toggleSelectAllHistory() {
            const q = searchQueries.history;
            const filtered = records.filter(r =>
                (r.status === 'completed' || r.status === 'deleted') && matchesQuery(r, q));
            const allSelected = filtered.length > 0 && filtered.every(r => selectedHistoryIds.has(r.id));
            filtered.forEach(r => allSelected ? selectedHistoryIds.delete(r.id) : selectedHistoryIds.add(r.id));
            rerenderHistoryList();
        }

        // Red floating bar at the bottom while selecting
        function updateDeleteBar() {
            let bar = document.getElementById('delete-bar');
            if (!historySelectMode || currentTab !== 'history') {
                if (bar) bar.remove();
                return;
            }
            if (!bar) {
                bar = document.createElement('div');
                bar.id = 'delete-bar';
                bar.className = 'fixed bottom-6 left-1/2 -translate-x-1/2 z-30';
                document.body.appendChild(bar);
            }
            const n = selectedHistoryIds.size;
            bar.innerHTML = `
                <button onclick="deleteSelectedHistory()" ${n === 0 ? 'disabled' : ''}
                        class="flex items-center gap-2 px-6 py-3 rounded-full text-sm font-medium shadow-lg transition-colors ${n === 0 ? 'bg-gray-200 text-gray-400' : 'bg-red-600 text-white hover:bg-red-700 shadow-red-600/30'}">
                    ${ICON.trash} ลบ ${n} รายการ
                </button>`;
        }

        function deleteSelectedHistory() {
            const ids = [...selectedHistoryIds];
            if (ids.length === 0) return;

            const completedCount = records.filter(r => ids.includes(r.id) && r.status === 'completed').length;
            const message = `ลบ ${ids.length} รายการออกจากประวัติถาวร กู้คืนไม่ได้`
                + (completedCount ? ` และยอดเงินของ ${completedCount} รายการที่ส่งสำเร็จจะหายจากหน้าสรุปยอดด้วย` : '');

            openConfirmModal('ลบประวัติ?', message, async () => {
                const idSet = new Set(ids);
                records = records.filter(r => !idSet.has(r.id));
                exitHistorySelectMode(false);
                renderApp();

                try {
                    await apiRequest('POST', '/api/records/bulk-delete', { ids });
                    showToast(`ลบ ${ids.length} รายการแล้ว`, 'success');
                } catch (e) {
                    console.error('Error deleting history', e);
                    showToast('ลบไม่สำเร็จ', 'error');
                    await loadData();
                    renderApp();
                }
            }, true);
        }

        // ---------- Detail modal ----------

        function itemRow(record, item) {
            const canToggle = record.status === 'active';
            const cod = item.isCOD;
            const rowBg = item.isCompleted ? 'bg-gray-50 opacity-60' : (cod ? 'bg-orange-50' : 'bg-white');
            const textCls = item.isCompleted ? 'text-gray-400 line-through' : (cod ? 'text-orange-800' : 'text-gray-800');

            const toggle = canToggle ? `
                <button onclick="toggleItemStatus(${record.id}, ${item.originalIndex})" aria-label="ติ๊กรับของ"
                        class="flex-shrink-0 w-7 h-7 rounded-full flex items-center justify-center border-2 transition-colors focus:outline-none ${item.isCompleted ? 'bg-green-500 border-green-500 text-white' : 'bg-white border-gray-200 text-transparent hover:border-green-400'}">
                    ${ICON.check}
                </button>` : `<span class="w-7 h-7 flex-shrink-0 rounded-full bg-gray-100 flex items-center justify-center text-gray-400">${ICON.check}</span>`;

            return `
                <li class="flex items-center gap-3 text-sm ${rowBg} px-3 py-2.5 rounded-2xl transition-all">
                    ${toggle}
                    <span class="font-medium flex-1 break-all ${textCls}">${escapeHtml(item.tracking) || 'ไม่มีเลขพัสดุ'}</span>
                    ${cod && !item.isCompleted && canToggle ? `<span class="text-xs font-semibold text-orange-600 bg-orange-100 px-2 py-0.5 rounded-full">COD</span>` : ''}
                </li>`;
        }

        function setDetailBack(onBack) {
            const btn = document.getElementById('detail-back-btn');
            btn.onclick = onBack;
            btn.classList.toggle('hidden', !onBack);
            btn.classList.toggle('flex', !!onBack);
        }

        function showDetailModal() {
            const modal = document.getElementById('detail-modal');
            const content = document.getElementById('detail-modal-content');
            document.getElementById('detail-modal-body').scrollTop = 0;
            modal.classList.remove('hidden');
            setTimeout(() => content.classList.remove('scale-95', 'opacity-0'), 10);
        }

        // backDayKey: set when opened from the daily summary popup, shows a back button
        function openDetailModal(id, backDayKey = null) {
            const record = records.find(r => r.id === id);
            if (!record) return;

            document.getElementById('detail-modal-title').innerText = 'รายละเอียดพัสดุ';
            setDetailBack(backDayKey ? () => openDayDetail(backDayKey) : null);

            const modal = document.getElementById('detail-modal');
            const content = document.getElementById('detail-modal-content');
            const body = document.getElementById('detail-modal-body');
            const actions = document.getElementById('detail-modal-actions');

            const groupedItems = {};
            record.items.forEach((item, index) => {
                if (!groupedItems[item.transport]) groupedItems[item.transport] = [];
                groupedItems[item.transport].push({ ...item, originalIndex: index });
            });

            const activeItemsCount = record.items.filter(i => !i.isCompleted).length;

            // LINE name: green pill + copy button
            const lineHtml = record.lineName ? `
                <div class="mt-2 inline-flex items-center gap-1.5 max-w-full pl-3.5 pr-1 py-1 rounded-full bg-green-50 text-green-700 text-sm">
                    <span class="font-semibold flex-shrink-0">LINE</span>
                    <span class="truncate">${escapeHtml(record.lineName)}</span>
                    <button onclick="copyLineName(${record.id}, this)" title="คัดลอกชื่อไลน์" aria-label="คัดลอกชื่อไลน์"
                            class="flex-shrink-0 w-7 h-7 rounded-full bg-white/70 hover:bg-white text-green-700 flex items-center justify-center transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-green-300">
                        ${ICON.copy}
                    </button>
                </div>` : '';

            let bodyHtml = `
                <div class="mb-5 pt-1 flex flex-col items-center text-center">
                    <div class="h-16 w-16 bg-blue-50 text-blue-700 rounded-full flex items-center justify-center text-xl font-semibold mb-3">${escapeHtml(record.room)}</div>
                    <h2 class="text-xl font-semibold text-gray-800">${escapeHtml(record.name)}</h2>
                    ${lineHtml}
                    <p class="text-sm text-gray-400 mt-2">หอพัก ${escapeHtml(record.room)} · คงเหลือ ${activeItemsCount}/${record.items.length} ชิ้น</p>
                </div>
                <div class="space-y-3">
            `;

            TRANSPORTS.forEach(trans => {
                const items = groupedItems[trans.id];
                if (!items || items.length === 0) return;

                const nonCod = items.filter(i => !i.isCOD);
                const cod = items.filter(i => i.isCOD);

                bodyHtml += `
                    <div class="bg-gray-50 rounded-3xl p-3">
                        <div class="flex items-center gap-2 px-1 pb-2">
                            <span>${trans.icon}</span>
                            <span class="font-medium ${trans.colorClass}">${trans.name}</span>
                            <span class="ml-auto text-xs px-2 py-0.5 rounded-full ${trans.badgeClass}">${items.length}</span>
                        </div>
                        ${nonCod.length ? `
                            <p class="text-xs text-gray-400 px-1 mb-1.5">ไม่ปลายทาง</p>
                            <ul class="space-y-1.5 mb-2">${nonCod.map(i => itemRow(record, i)).join('')}</ul>` : ''}
                        ${cod.length ? `
                            <p class="text-xs text-orange-500 px-1 mb-1.5">เก็บเงินปลายทาง (COD)</p>
                            <ul class="space-y-1.5">${cod.map(i => itemRow(record, i)).join('')}</ul>` : ''}
                    </div>`;
            });

            bodyHtml += '</div>';
            body.innerHTML = bodyHtml;

            if (record.status === 'active') {
                actions.innerHTML = `
                    <button onclick="openConfirmModal('ยืนยันการลบ', 'คุณต้องการลบและย้ายข้อมูลนี้ไปประวัติสถานะยกเลิก ใช่หรือไม่?', () => markStatus(${record.id}, 'deleted'))" class="${BTN.softRed} flex items-center gap-1">${ICON.trash} ลบ</button>
                    <div class="flex-1"></div>
                    <button onclick="editRecord(${record.id})" class="${BTN.soft}">แก้ไข</button>
                    <button onclick="openConfirmModal('รับของครบแล้ว?', 'ระบบจะย้ายข้อมูลไปยังหน้ารอส่งของ ยืนยันหรือไม่?', () => markStatus(${record.id}, 'pending'))" class="${BTN.amber}">รับของครบแล้ว</button>
                `;
            } else if (record.status === 'pending') {
                actions.innerHTML = `
                    <button onclick="openConfirmModal('ย้อนกลับการแก้ไข', 'คุณต้องการย้อนกลับข้อมูลไปก่อนหน้านี้ ใช่หรือไม่?', () => markStatus(${record.id}, 'active'))" class="${BTN.softBlue}">ย้อนกลับ (แก้ไข)</button>
                    <div class="flex-1"></div>
                    <button onclick="openConfirmModal('ส่งพัสดุสำเร็จ', 'ผู้รับได้รับพัสดุเรียบร้อยแล้วและต้องการย้ายไปหน้าประวัติ ใช่หรือไม่?', () => markStatus(${record.id}, 'completed'))" class="${BTN.green}">ส่งพัสดุสำเร็จ</button>
                `;
            } else {
                actions.innerHTML = `
                    <button onclick="openConfirmModal('ย้อนกลับข้อมูล', 'คุณต้องการนำข้อมูลนี้กลับมาใช้งานอีกครั้ง ใช่หรือไม่?', () => markStatus(${record.id}, 'active'))" class="${BTN.softBlue}">ย้อนกลับ (Undo)</button>
                    <div class="flex-1"></div>
                    <button onclick="closeDetailModal()" class="${BTN.soft}">ปิด</button>
                `;
            }

            showDetailModal();
        }

        function closeDetailModal() {
            const modal = document.getElementById('detail-modal');
            const content = document.getElementById('detail-modal-content');
            content.classList.add('scale-95', 'opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 200);
        }

        async function copyLineName(id, btn) {
            const record = records.find(r => r.id === id);
            const text = record?.lineName || '';
            if (!text) return;

            let ok = false;
            try {
                await navigator.clipboard.writeText(text);
                ok = true;
            } catch {
                // Fallback for older browsers / non-HTTPS
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.setAttribute('readonly', '');
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                try { ok = document.execCommand('copy'); } catch { ok = false; }
                ta.remove();
            }

            if (ok) {
                showToast('คัดลอกชื่อไลน์แล้ว', 'success');
                if (btn) {
                    btn.innerHTML = ICON.check;
                    setTimeout(() => { btn.innerHTML = ICON.copy; }, 1500);
                }
            } else {
                showToast('คัดลอกไม่สำเร็จ', 'error');
            }
        }

        // ---------- Form ----------

        function showFormModal() {
            const modal = document.getElementById('form-modal');
            const content = document.getElementById('form-modal-content');
            modal.classList.remove('hidden');
            setTimeout(() => content.classList.remove('scale-95', 'opacity-0'), 10);
        }

        function openFormModal() {
            currentEditingId = null;
            document.getElementById('form-modal-title').innerText = 'เพิ่มข้อมูลพัสดุ';
            formData = {
                name: '',
                lineName: '',
                room: DORM_ROOMS[0],
                items: [{ tracking: '', transport: '', isCOD: false, isCompleted: false }]
            };
            updateFormUI();
            showFormModal();
        }

        function editRecord(id) {
            const record = records.find(r => r.id === id);
            if (!record) return;

            closeDetailModal();

            currentEditingId = id;
            document.getElementById('form-modal-title').innerText = 'แก้ไขข้อมูลพัสดุ';
            formData = JSON.parse(JSON.stringify(record));
            if (formData.lineName === undefined) formData.lineName = '';

            updateFormUI();
            showFormModal();
        }

        function closeFormModal() {
            const modal = document.getElementById('form-modal');
            const content = document.getElementById('form-modal-content');
            content.classList.add('scale-95', 'opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 200);
        }

        function updateFormUI() {
            document.getElementById('input-name').value = formData.name;
            document.getElementById('input-line').value = formData.lineName || '';
            document.getElementById('input-room').value = formData.room;
            renderFormItems();
        }

        document.getElementById('input-name').addEventListener('input', (e) => formData.name = e.target.value);
        document.getElementById('input-line').addEventListener('input', (e) => formData.lineName = e.target.value);
        document.getElementById('input-room').addEventListener('change', (e) => formData.room = e.target.value);

        function renderFormItems() {
            const container = document.getElementById('form-items-container');

            if (formData.items.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-5 text-sm text-gray-400 bg-gray-50 rounded-2xl">
                        ยังไม่มีรายการพัสดุ กด “เพิ่มของ” เพื่อเริ่ม
                    </div>`;
                return;
            }

            container.innerHTML = formData.items.map((item, index) => `
                <div class="bg-gray-50 p-4 rounded-3xl">
                    <div class="flex items-center justify-between mb-3">
                        <span class="text-xs font-semibold text-blue-700 bg-blue-100 w-6 h-6 rounded-full flex items-center justify-center">${index + 1}</span>
                        <button type="button" onclick="removeFormItem(${index})" aria-label="ลบรายการนี้" class="w-8 h-8 rounded-full flex items-center justify-center text-gray-400 hover:text-red-500 hover:bg-red-50 transition-colors">${ICON.trash}</button>
                    </div>
                    <div class="space-y-3">
                        <input type="text" value="${escapeHtml(item.tracking)}" oninput="updateItemField(${index}, 'tracking', this.value)" class="field field-white uppercase" placeholder="เลขพัสดุ (ถ้ามี)">
                        <div class="grid grid-cols-2 gap-2">
                            <select onchange="updateItemField(${index}, 'transport', this.value)" class="field field-white" aria-label="ขนส่ง">
                                <option value="" disabled ${!item.transport ? 'selected' : ''}>เลือกขนส่ง</option>
                                ${TRANSPORTS.map(t => `<option value="${t.id}" ${item.transport === t.id ? 'selected' : ''}>${t.name}</option>`).join('')}
                            </select>
                            <select onchange="updateItemField(${index}, 'isCOD', this.value === 'true')" class="field field-white ${item.isCOD ? 'text-orange-600 font-medium' : ''}" aria-label="ประเภทจัดส่ง">
                                <option value="false" ${!item.isCOD ? 'selected' : ''}>ไม่ปลายทาง</option>
                                <option value="true" ${item.isCOD ? 'selected' : ''}>ปลายทาง (COD)</option>
                            </select>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function addFormItem() {
            const validTransport = TRANSPORTS.some(t => t.id === currentTab) ? currentTab : 'flash';
            formData.items.push({ tracking: '', transport: validTransport, isCOD: false, isCompleted: false });
            renderFormItems();
            setTimeout(() => {
                const scrollArea = document.getElementById('form-scroll-area');
                scrollArea.scrollTo({ top: scrollArea.scrollHeight, behavior: 'smooth' });
            }, 50);
        }

        function removeFormItem(index) {
            formData.items.splice(index, 1);
            renderFormItems();
        }

        function updateItemField(index, field, value) {
            formData.items[index][field] = value;
            if (field === 'isCOD') renderFormItems();
        }

        async function saveRecord() {
            if (!formData.name.trim()) {
                showToast("กรุณากรอกชื่อ-นามสกุล", "error");
                document.getElementById('input-name').focus();
                return;
            }
            if (formData.items.length === 0) {
                showToast("กรุณาเพิ่มรายการพัสดุอย่างน้อย 1 รายการ", "error");
                return;
            }
            if (formData.items.some(item => !item.transport)) {
                showToast("กรุณาเลือกขนส่งให้ครบทุกรายการ", "error");
                return;
            }

            const lineName = (formData.lineName || '').trim();
            const timestamp = Date.now();

            if (currentEditingId) {
                const index = records.findIndex(r => r.id === currentEditingId);
                if (index !== -1) {
                    const fields = {
                        name: formData.name.trim(),
                        lineName,
                        room: formData.room,
                        items: formData.items,
                        updatedAt: timestamp
                    };
                    records[index] = { ...records[index], ...fields };
                    showToast("แก้ไขข้อมูลสำเร็จ", "success");
                    closeFormModal();
                    await updateRecordOnServer(currentEditingId, fields);
                }
            } else {
                const newRecord = {
                    name: formData.name.trim(),
                    lineName,
                    room: formData.room,
                    items: formData.items,
                    id: timestamp * 1000 + Math.floor(Math.random() * 1000),
                    status: 'active',
                    createdAt: timestamp,
                    updatedAt: timestamp
                };
                records.push(newRecord);
                showToast("บันทึกข้อมูลสำเร็จ", "success");
                closeFormModal();
                await createRecordOnServer(newRecord);
            }
        }

        // ---------- Status changes ----------

        async function toggleItemStatus(recordId, itemIndex) {
            const record = records.find(r => r.id === recordId);
            if (!record) return;

            record.items[itemIndex].isCompleted = !record.items[itemIndex].isCompleted;
            record.updatedAt = Date.now();

            const allCompleted = record.items.every(i => i.isCompleted);
            if (allCompleted) record.status = 'pending';

            const request = updateRecordOnServer(recordId, {
                items: record.items,
                status: record.status,
                updatedAt: record.updatedAt
            });

            if (allCompleted) {
                closeDetailModal();
                showToast("รับของครบทุกชิ้นแล้ว ย้ายไปยังหน้ารอส่งของ", "success");
            } else {
                openDetailModal(recordId);
            }

            await request;
        }

        async function markStatus(id, newStatus) {
            const record = records.find(r => r.id === id);
            if (!record) return;

            record.status = newStatus;
            record.updatedAt = Date.now();

            if (newStatus === 'completed') {
                record.items.forEach(item => item.isCompleted = true);
                showToast("ส่งพัสดุสำเร็จ ย้ายลงประวัติ", "success");
            } else if (newStatus === 'pending') {
                record.items.forEach(item => item.isCompleted = true);
                showToast("รับของครบแล้ว ย้ายไปหน้ารอส่งของ", "success");
            } else if (newStatus === 'active') {
                record.items.forEach(item => item.isCompleted = false);
                showToast("นำข้อมูลกลับมาใช้งานแล้ว", "info");
            } else if (newStatus === 'deleted') {
                showToast("ย้ายไปยังประวัติแล้ว", "info");
            }

            closeDetailModal();
            await updateRecordOnServer(id, {
                status: record.status,
                items: record.items,
                updatedAt: record.updatedAt
            });
        }

        // ---------- Toast & confirm ----------

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toastId = 'toast-' + Date.now() + '-' + Math.floor(Math.random() * 1000);

            const bgClass = type === 'success' ? 'bg-green-600' : type === 'error' ? 'bg-red-600' : 'bg-gray-800';

            container.insertAdjacentHTML('beforeend', `
                <div id="${toastId}" class="${bgClass} text-white px-5 py-2.5 rounded-full shadow-lg toast-show text-sm font-medium">
                    ${message}
                </div>
            `);

            const toastElement = document.getElementById(toastId);
            setTimeout(() => {
                toastElement.classList.remove('toast-show');
                toastElement.classList.add('toast-hide');
                setTimeout(() => toastElement.remove(), 250);
            }, 2600);
        }

        document.getElementById('detail-modal').addEventListener('click', function (e) {
            if (e.target === this) closeDetailModal();
        });
        document.getElementById('form-modal').addEventListener('click', function (e) {
            if (e.target === this) closeFormModal();
        });
        document.getElementById('confirm-modal').addEventListener('click', function (e) {
            if (e.target === this) closeConfirmModal();
        });

        document.addEventListener('click', function (e) {
            if (!mobileMenuOpen) return;
            const menu = document.getElementById('mobile-menu');
            const hamburgerBtn = document.getElementById('hamburger-btn');
            if (!menu.contains(e.target) && !hamburgerBtn.contains(e.target)) closeMobileMenu();
        });

        let confirmActionCallback = null;

        function openConfirmModal(title, message, callback, danger = false) {
            document.getElementById('confirm-title').innerText = title;
            document.getElementById('confirm-message').innerText = message;
            confirmActionCallback = callback;

            document.getElementById('btn-confirm-action').className =
                `flex-1 py-2.5 rounded-full text-sm font-medium text-white transition-colors ${danger ? 'bg-red-600 hover:bg-red-700' : 'bg-blue-600 hover:bg-blue-700'}`;
            document.getElementById('btn-confirm-action').onclick = function () {
                if (confirmActionCallback) confirmActionCallback();
                closeConfirmModal();
            };

            const modal = document.getElementById('confirm-modal');
            const content = document.getElementById('confirm-modal-content');
            modal.classList.remove('hidden');
            setTimeout(() => content.classList.remove('scale-95', 'opacity-0'), 10);
        }

        function closeConfirmModal() {
            const modal = document.getElementById('confirm-modal');
            const content = document.getElementById('confirm-modal-content');
            content.classList.add('scale-95', 'opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 200);
        }

        // ---------- Long-press on a history row = start selecting ----------

        (function setupHistoryLongPress() {
            const page = document.getElementById('page');
            const LONG_PRESS_MS = 500;
            const MOVE_TOLERANCE = 10;

            let timer = null;
            let pressedRow = null;
            let startX = 0;
            let startY = 0;
            let suppressNextClick = false;

            function cancelPress() {
                clearTimeout(timer);
                timer = null;
                if (pressedRow) pressedRow.classList.remove('pressing');
                pressedRow = null;
            }

            page.addEventListener('pointerdown', (e) => {
                suppressNextClick = false;
                if (currentTab !== 'history' || historySelectMode) return;
                if (e.pointerType === 'mouse' && e.button !== 0) return;
                const row = e.target.closest('[data-history-id]');
                if (!row) return;

                startX = e.clientX;
                startY = e.clientY;
                pressedRow = row;
                row.classList.add('pressing');

                const id = Number(row.dataset.historyId);
                timer = setTimeout(() => {
                    timer = null;
                    pressedRow = null;
                    suppressNextClick = true;   // don't open the detail popup
                    if (navigator.vibrate) navigator.vibrate(30);
                    enterHistorySelectMode(id);
                }, LONG_PRESS_MS);
            });

            page.addEventListener('pointermove', (e) => {
                if (!timer) return;
                if (Math.abs(e.clientX - startX) > MOVE_TOLERANCE || Math.abs(e.clientY - startY) > MOVE_TOLERANCE) {
                    cancelPress();   // user is scrolling
                }
            });

            ['pointerup', 'pointercancel', 'pointerleave'].forEach(type =>
                page.addEventListener(type, () => { if (timer) cancelPress(); }));

            // Swallow the click that follows a long press
            page.addEventListener('click', (e) => {
                if (suppressNextClick) {
                    suppressNextClick = false;
                    e.preventDefault();
                    e.stopPropagation();
                }
            }, true);

            // Stop the phone's own long-press menu on history rows
            page.addEventListener('contextmenu', (e) => {
                if (e.target.closest('[data-history-id]')) e.preventDefault();
            });
        })();

        // ---------- Pull to refresh ----------

        (function setupPullToRefresh() {
            const container = document.getElementById('main-content');
            const indicator = document.getElementById('pull-refresh-indicator');
            const icon = document.getElementById('pull-refresh-icon');
            const THRESHOLD = 70;
            const MAX_PULL = 100;

            let startY = 0;
            let pullDistance = 0;
            let pulling = false;
            let refreshing = false;

            container.addEventListener('touchstart', (e) => {
                if (refreshing) return;
                if (container.scrollTop <= 0) {
                    startY = e.touches[0].clientY;
                    pulling = true;
                } else {
                    pulling = false;
                }
            }, { passive: true });

            container.addEventListener('touchmove', (e) => {
                if (!pulling || refreshing) return;
                const deltaY = e.touches[0].clientY - startY;
                if (deltaY <= 0) {
                    pullDistance = 0;
                    indicator.style.opacity = '0';
                    indicator.classList.add('hidden');
                    return;
                }
                pullDistance = Math.min(deltaY * 0.5, MAX_PULL);
                indicator.classList.remove('hidden');
                indicator.style.transform = `translateY(${pullDistance}px)`;
                indicator.style.opacity = String(Math.min(pullDistance / THRESHOLD, 1));
            }, { passive: true });

            container.addEventListener('touchend', async () => {
                if (!pulling || refreshing) { pulling = false; return; }
                pulling = false;

                if (pullDistance >= THRESHOLD) {
                    refreshing = true;
                    icon.classList.add('animate-spin');
                    indicator.style.transform = `translateY(${THRESHOLD}px)`;
                    indicator.style.opacity = '1';

                    await loadData();
                    renderApp();

                    icon.classList.remove('animate-spin');
                    refreshing = false;
                }

                pullDistance = 0;
                indicator.style.transform = 'translateY(0px)';
                indicator.style.opacity = '0';
                setTimeout(() => indicator.classList.add('hidden'), 200);
            });
        })();

        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
